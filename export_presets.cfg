html/head_include="<script>/* Just Tap: on itch the game runs in a cross-origin iframe and Chrome can leave its AudioContext suspended. Resume every AudioContext on any gesture inside the game. */(function(){var O=window.AudioContext||window.webkitAudioContext;if(!O)return;var all=[];function P(){var a=[null].concat([].slice.call(arguments));var c=new (Function.prototype.bind.apply(O,a))();all.push(c);return c;}P.prototype=O.prototype;window.AudioContext=P;if(window.webkitAudioContext)window.webkitAudioContext=P;function wake(){for(var i=0;i<all.length;i++){if(all[i].state!==\"running\"){all[i].resume().catch(function(){});}}}[\"pointerdown\",\"mousedown\",\"touchstart\",\"touchend\",\"keydown\",\"click\"].forEach(function(e){window.addEventListener(e,wake,true);});window.__justTapAudio=all;})();</script>"
